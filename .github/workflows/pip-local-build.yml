name: PiP local test build

on:
  push:
    branches:
      - codex/pip-local-build

permissions:
  contents: read

concurrency:
  group: pip-local-build
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  TURBO_TELEMETRY_DISABLED: 1
  BASE_COMMIT: 51e0215839279c99886c5dce79f3d4573c02c769
  PIP_COMMIT: 391dfa679a0954d6a337cb050a88a5728a52e416
  ENGINE_TREE: 38b319abda74f8d85f49035eecaef1a98f1c2ede

jobs:
  build:
    if: github.repository == 'ikTheProgrammer1/ardia'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the PiP fix to the installed release
        run: |
          set -euo pipefail
          test "$(git rev-parse v0.2.44^{commit})" = "$BASE_COMMIT"
          git merge-base --is-ancestor "$PIP_COMMIT" HEAD
          git diff "$PIP_COMMIT^" "$PIP_COMMIT" -- \
            packages/ardiacore/ios/ArdiaWindowFullScreen.mm \
            packages/ardiacore/ios/ArdiaWindowSight.h \
            packages/ardiacore/ios/ArdiaWindowSight.mm \
            packages/ardiacore/ios/ArdiaLaunchConfig.mm \
            packages/ardiacore/tests/window-sight.test.mm > "$RUNNER_TEMP/pip.patch"
          test -s "$RUNNER_TEMP/pip.patch"
          git checkout --detach "$BASE_COMMIT"
          git apply --check "$RUNNER_TEMP/pip.patch"
          git apply "$RUNNER_TEMP/pip.patch"
          test "$(git rev-parse HEAD:engine)" = "$ENGINE_TREE"
          git diff --check
      - name: Isolate the local test bundle's default profile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/ardiacore/ios/ArdiaLaunchConfig.mm")
          source = path.read_text()
          needle = "    _dataDirectory = StandardizedDirectory(environment[kDataDirVariable]);\n"
          replacement = needle + '''    if (!_dataDirectory && [NSBundle.mainBundle.bundleIdentifier isEqualToString:@"com.ardia.pip-test"])
                _dataDirectory = [NSHomeDirectory() stringByAppendingPathComponent:@"Library/Application Support/Ardia PiP Test"];
          '''
          if source.count(needle) != 1:
              raise SystemExit("ArdiaLaunchConfig data-directory assignment did not match")
          path.write_text(source.replace(needle, replacement, 1))
          project = Path("apps/browser/macos/Ardia.xcodeproj/project.pbxproj")
          source = project.read_text()
          needle = "PRODUCT_BUNDLE_IDENTIFIER = com.ardia.browser;"
          if source.count(needle) != 2:
              raise SystemExit("The two application bundle identifiers did not match")
          project.write_text(source.replace(needle, "PRODUCT_BUNDLE_IDENTIFIER = com.ardia.pip-test;"))
          PY
          git diff --check
      - name: Check the native focus regression
        working-directory: packages/ardiacore
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ -std=c++20 -fobjc-arc -Wall -Werror -framework AppKit \
            ios/ArdiaWindowSight.mm tests/window-sight.test.mm -o "$RUNNER_TEMP/window-sight-test"
          "$RUNNER_TEMP/window-sight-test"
      - name: Fetch the exact verified engine
        run: |
          set -euo pipefail
          framework=$(packages/ardiacore/scripts/fetch-engine.sh)
          test -f "$framework/Versions/Current/Chromium Framework"
          echo "ARDIACORE_FRAMEWORK=$framework" >> "$GITHUB_ENV"
          echo "ARDIACORE_FRAMEWORK_ENGINE=$ENGINE_TREE" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: Install JavaScript dependencies
        run: scripts/agent/locked pod --as pip-local-build -- pnpm install --frozen-lockfile
      - name: Install CocoaPods dependencies
        working-directory: apps/browser/macos
        run: ../../../scripts/agent/locked pod --as pip-local-build -- pod install
      - name: Build the unsigned application
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pip-unsigned.xcconfig" <<'CONFIG'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          CONFIG
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/pip-unsigned.xcconfig" \
            scripts/agent/build-app --as pip-local-build --config Release --force
      - name: Package the test application
        run: |
          set -euo pipefail
          products="$GITHUB_WORKSPACE/apps/browser/build-pip-local-build/Build/Products/Release"
          test -x "$products/Ardia.app/Contents/MacOS/Ardia"
          test -f "$products/Ardia.app/Contents/Resources/main.jsbundle"
          python3 - "$products/Ardia.app" <<'PY'
          import plistlib, sys
          from pathlib import Path
          bundle = Path(sys.argv[1])
          path = bundle / "Contents/Info.plist"
          with path.open("rb") as source:
              info = plistlib.load(source)
          if info.get("CFBundleIdentifier") != "com.ardia.pip-test":
              raise SystemExit("The built application did not use its isolated test bundle identifier")
          info["CFBundleDisplayName"] = "Ardia PiP Test"
          info["CFBundleName"] = "Ardia PiP Test"
          for key in list(info):
              if key.startswith("SU") or key in {
                  "ACUpdateChannel", "ACReleaseNotesURL", "CFBundleURLTypes", "CFBundleDocumentTypes",
                  "NSUserActivityTypes", "NSDockTilePlugIn",
              }:
                  info.pop(key)
          with path.open("wb") as output:
              plistlib.dump(info, output)
          (bundle / "Contents/embedded.provisionprofile").unlink(missing_ok=True)
          PY
          PIP_PATCH_SHA=$(shasum -a 256 "$RUNNER_TEMP/pip.patch" | awk '{print $1}')
          export PIP_PATCH_SHA
          python3 - "$products/pip-build.json" <<'PY'
          import json, os, subprocess, sys
          info = {
              "base_version": "0.2.44",
              "base_commit": os.environ["BASE_COMMIT"],
              "pip_commit": os.environ["PIP_COMMIT"],
              "engine_tree": os.environ["ENGINE_TREE"],
              "patch_sha256": os.environ["PIP_PATCH_SHA"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "run_url": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "xcode": subprocess.check_output(["xcodebuild", "-version"], text=True).strip(),
              "app_signing": "unsigned root; nested components retain build-time ad-hoc signatures",
              "test_profile_fallback": "com.ardia.pip-test defaults to ~/Library/Application Support/Ardia PiP Test when ARDIA_DATA_DIR is unset",
              "bundle_identifier": "com.ardia.pip-test",
              "display_name": "Ardia PiP Test",
          }
          with open(sys.argv[1], "w") as out:
              json.dump(info, out, indent=2)
              out.write("\n")
          PY
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "$RUNNER_TEMP/Ardia-PiP-Test.tar.gz" \
            -C "$products" Ardia.app pip-build.json
          shasum -a 256 "$RUNNER_TEMP/Ardia-PiP-Test.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          cat "$products/pip-build.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ardia-pip-local-test
          path: ${{ runner.temp }}/Ardia-PiP-Test.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ardia-pip-build-log
          path: apps/browser/build-pip-local-build/build-app.log
          if-no-files-found: ignore
          retention-days: 3
